# Permission-constellation capability. Format: docs/reema/capability-rules.md.
#
# This is the one capability that works on a packed sample: when the real DEX is
# unpacked at runtime the code index has no API calls, but the manifest still
# declares the permissions. A single dangerous permission is common in benign
# apps, so this fires only when several HIGH-RISK permissions co-occur
# (any_of_min) — a combination that is rare outside banker/spyware/SMS-trojan
# families. It is attributed to the app because the permissions are declared in
# the sample's own manifest.
id: dangerous_permission_set
title: Declares a high-risk permission constellation
severity: high
attck:
  - T1626
  - T1636
tags:
  - permission-profile
  - packed
description: >
  The manifest requests at least two of the "abuse" permissions that mobile
  malware combines to drive the UI, overlay other apps, take device-admin
  control, or side-load packages. Unlike SMS or contact permissions (which
  benign messengers and dialers legitimately hold), benign apps rarely declare
  two of these together. On a packed sample this is often the only static
  signal, since the real code is unpacked at runtime.
recommendation: >
  Treat as a strong lead: review the declared components (accessibility service,
  admin receiver) and run the sample dynamically to recover the unpacked DEX for
  a full capability read.
# Must include a STRONG abuse permission (an accessibility service or
# device-admin -- things a benign app almost never declares), plus at least two
# abuse permissions in total. This excludes a benign messenger that holds only
# the weak pair {SYSTEM_ALERT_WINDOW (call overlay), REQUEST_INSTALL_PACKAGES
# (self-update)} while still firing on a banker/dropper that abuses accessibility
# or device-admin.
requires:
  - permission:
      - "BIND_ACCESSIBILITY_SERVICE"
      - "BIND_DEVICE_ADMIN"
any_of_min: 2
any_of:
  - permission: "BIND_ACCESSIBILITY_SERVICE"
  - permission: "SYSTEM_ALERT_WINDOW"
  - permission: "BIND_DEVICE_ADMIN"
  - permission: "REQUEST_INSTALL_PACKAGES"
