# Behaviour chains combine capability ids into a known-profile verdict.
#
# Precision-first (corpus-tuned against benign comms/camera/SMS apps, which share
# a malware's sensor capabilities): every chain pivots on a `require` capability
# that is a malware-specific discriminator -- an accessibility service that reads
# the screen, a screen overlay, device-admin control, runtime code loading, or
# the dangerous-permission constellation -- which a benign app with the same
# microphone/camera/contacts capabilities does not have. `require` capabilities
# must ALL be present; then at least `min_match` of the supporting `capabilities`.
# Capability ids are defined in reema/capabilities/*.yaml.
chains:
  - id: android_banker
    title: Banking trojan (overlay + abuse)
    family: Banker
    label: malicious
    require:
      - overlay_phishing
    capabilities:
      - accessibility_abuse
      - device_admin
      - dangerous_permission_set
      - sms_intercept
    min_match: 1

  - id: sms_fraud
    title: SMS trojan (interception + abuse)
    family: SMSTrojan
    label: malicious
    require:
      - sms_intercept
    capabilities:
      - accessibility_abuse
      - device_admin
      - dangerous_permission_set
    min_match: 1

  - id: spyware
    title: Spyware / stalkerware (accessibility-driven surveillance)
    family: Spyware
    label: malicious
    require:
      - accessibility_abuse
    capabilities:
      - audio_record
      - location_tracking
      - contact_exfiltration
      - call_log_access
      - sms_intercept
      - screen_capture
    min_match: 2

  - id: remote_access_trojan
    title: RAT (accessibility + live capture)
    family: RAT
    label: malicious
    require:
      - accessibility_abuse
    capabilities:
      - screen_capture
      - audio_record
      - camera_capture
    min_match: 1

  - id: dropper
    title: Dropper (runtime code load + install)
    family: Dropper
    label: malicious
    require:
      - dynamic_code_loading
      - package_install

  - id: ransomware
    title: Locker/ransomware (device-admin + persistence)
    family: Ransomware
    label: malicious
    require:
      - device_admin
    capabilities:
      - boot_persistence
      - overlay_phishing
    min_match: 1
